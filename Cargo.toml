[package]
name = "agent-dossier"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A local evidence compiler for Codex history"
license = "MIT"
repository = "https://github.com/rudrankriyam/agent-dossier"
keywords = ["codex", "cli", "history", "provenance", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agent-dossier"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
